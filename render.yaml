# Blueprint do Render para Deploy Automático do Nexo Backend + Banco PostgreSQL
# Acesse https://dashboard.render.com -> Blueprints -> New Blueprint Instance e selecione seu repositório.

databases:
  - name: nexo-database
    plan: free
    region: ohio
    databaseName: nexo_db
    user: nexo_user

services:
  - type: web
    name: nexo-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build:backend
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
